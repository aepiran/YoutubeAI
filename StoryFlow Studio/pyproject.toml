[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "storyflow-studio"
version = "0.3.0"
description = "Modular desktop workflow from script to voice, beats, and footage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "keyring>=25.0",
  "openai-codex==0.144.4",
  "Pillow>=12.0",
  "PySide6>=6.8",
  "requests>=2.32",
  "torch>=2.10",
  "transformers>=5.14,<6",
]

[project.scripts]
storyflow-studio = "storyflow_studio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storyflow_studio = ["assets/*.png", "assets/dna/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
